<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
  <defs>
    <clipPath id="av-n">
      <circle cx="26" cy="26" r="26"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <circle cx="26" cy="26" r="26" fill="#1a1a2e"/>

  <!-- Shoulders / shirt -->
  <path d="M 0 52 Q 6 40 16 38 L 36 38 Q 46 40 52 52 Z" fill="#2d2d50" clip-path="url(#av-n)"/>

  <!-- Collar accent (purple V — brand consistency) -->
  <path d="M 20 38 L 26 44 L 32 38" stroke="#A100FF" stroke-width="1.8" fill="none" stroke-linecap="round" clip-path="url(#av-n)"/>

  <!-- Neck -->
  <rect x="22" y="32" width="8" height="8" rx="2" fill="#c89878" clip-path="url(#av-n)"/>

  <!-- Face (lighter, slightly weathered) -->
  <ellipse cx="26" cy="23" rx="10.5" ry="12" fill="#dca890"/>

  <!-- Hair — top (silver/white, slightly receding hairline for older feel) -->
  <path d="M 17 17 Q 19 11.5 26 11.2 Q 33 11.5 35 17 Q 31 14.2 26 14.2 Q 21 14.2 17 17 Z" fill="#d8d8d8"/>

  <!-- Hair — sides (silver) -->
  <path d="M 16 17 Q 15 22 16 28" stroke="#c8c8c8" stroke-width="2.4" fill="none" stroke-linecap="round" clip-path="url(#av-n)"/>
  <path d="M 36 17 Q 37 22 36 28" stroke="#c8c8c8" stroke-width="2.4" fill="none" stroke-linecap="round" clip-path="url(#av-n)"/>

  <!-- Eyebrows — silver, distinguished, slightly thicker -->
  <path d="M 18 19.3 Q 21 17.8 23.5 19.3" stroke="#a8a8a8" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M 28.5 19.3 Q 31 17.8 34 19.3" stroke="#a8a8a8" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Eyes — gentle blue-grey -->
  <ellipse cx="21" cy="23" rx="2.3" ry="2.1" fill="#fff"/>
  <ellipse cx="31" cy="23" rx="2.3" ry="2.1" fill="#fff"/>
  <circle cx="21.4" cy="23.2" r="1.4" fill="#5a7585"/>
  <circle cx="31.4" cy="23.2" r="1.4" fill="#5a7585"/>
  <circle cx="21.6" cy="23.3" r="0.65" fill="#0a1015"/>
  <circle cx="31.6" cy="23.3" r="0.65" fill="#0a1015"/>
  <circle cx="22" cy="22.8" r="0.4" fill="#fff" opacity="0.9"/>
  <circle cx="32" cy="22.8" r="0.4" fill="#fff" opacity="0.9"/>

  <!-- Crow's feet (subtle age detail) -->
  <path d="M 17.5 23 L 19 23.5" stroke="#9a7058" stroke-width="0.4" opacity="0.5"/>
  <path d="M 17.5 24 L 19 24" stroke="#9a7058" stroke-width="0.4" opacity="0.5"/>
  <path d="M 33 23.5 L 34.5 23" stroke="#9a7058" stroke-width="0.4" opacity="0.5"/>
  <path d="M 33 24 L 34.5 24" stroke="#9a7058" stroke-width="0.4" opacity="0.5"/>

  <!-- Nose -->
  <path d="M 25 25 Q 25.5 28.5 27.5 29" stroke="#9a7058" stroke-width="0.9" fill="none" stroke-linecap="round"/>

  <!-- Mouth — gentle, contemplative (slight smile) -->
  <path d="M 21.5 31 Q 26 32.6 30.5 31" stroke="#7a5040" stroke-width="1.2" fill="none" stroke-linecap="round"/>

  <!-- Beard — small white/silver -->
  <path d="M 20.5 31.8 Q 22.5 35.5 26 36 Q 29.5 35.5 31.5 31.8" fill="#d8d8d8"/>
  <path d="M 22 33 Q 26 35.5 30 33" stroke="#b8b8b8" stroke-width="0.4" fill="none" opacity="0.6"/>

  <!-- Ears -->
  <ellipse cx="15.5" cy="24" rx="1.6" ry="2.3" fill="#c89878"/>
  <ellipse cx="36.5" cy="24" rx="1.6" ry="2.3" fill="#c89878"/>
</svg>
