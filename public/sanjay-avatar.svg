<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
  <defs>
    <clipPath id="av-s">
      <circle cx="26" cy="26" r="26"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <circle cx="26" cy="26" r="26" fill="#1a1a2e"/>

  <!-- Shoulders / shirt -->
  <path d="M 0 52 Q 6 40 16 38 L 36 38 Q 46 40 52 52 Z" fill="#2d2d50" clip-path="url(#av-s)"/>

  <!-- Collar accent (purple V) -->
  <path d="M 20 38 L 26 44 L 32 38" stroke="#A100FF" stroke-width="1.8" fill="none" stroke-linecap="round" clip-path="url(#av-s)"/>

  <!-- Neck -->
  <rect x="22" y="32" width="8" height="8" rx="2" fill="#9a5b3a" clip-path="url(#av-s)"/>

  <!-- Face (warm Indian brown) -->
  <ellipse cx="26" cy="23" rx="10.5" ry="12" fill="#b87050"/>

  <!-- Hair — top (short professional, very dark) -->
  <path d="M 15.5 17 Q 18 10 26 9.8 Q 34 10 36.5 17 Q 32 13.8 26 13.8 Q 20 13.8 15.5 17 Z" fill="#1a0e0e"/>

  <!-- Hair — sides short -->
  <path d="M 15.5 17 Q 14.8 22 15.8 27" stroke="#1a0e0e" stroke-width="2.5" fill="none" stroke-linecap="round" clip-path="url(#av-s)"/>
  <path d="M 36.5 17 Q 37.2 22 36.2 27" stroke="#1a0e0e" stroke-width="2.5" fill="none" stroke-linecap="round" clip-path="url(#av-s)"/>

  <!-- Eyebrows — dark, defined -->
  <path d="M 17.8 19.2 Q 21 17.8 23.8 19.2" stroke="#0a0606" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <path d="M 28.2 19.2 Q 31 17.8 34.2 19.2" stroke="#0a0606" stroke-width="1.6" fill="none" stroke-linecap="round"/>

  <!-- Glasses -->
  <circle cx="21" cy="23" r="3.2" fill="none" stroke="#2a2a2a" stroke-width="1.1"/>
  <circle cx="31" cy="23" r="3.2" fill="none" stroke="#2a2a2a" stroke-width="1.1"/>
  <line x1="24.2" y1="23" x2="27.8" y2="23" stroke="#2a2a2a" stroke-width="1.1"/>

  <!-- Eyes -->
  <ellipse cx="21" cy="23" rx="1.4" ry="1.3" fill="#fff"/>
  <ellipse cx="31" cy="23" rx="1.4" ry="1.3" fill="#fff"/>
  <circle cx="21.3" cy="23.2" r="0.95" fill="#3a2010"/>
  <circle cx="31.3" cy="23.2" r="0.95" fill="#3a2010"/>
  <circle cx="21.5" cy="23" r="0.3" fill="#fff" opacity="0.85"/>
  <circle cx="31.5" cy="23" r="0.3" fill="#fff" opacity="0.85"/>

  <!-- Nose -->
  <path d="M 25 25 Q 25.5 28 27.4 28.4" stroke="#7a4530" stroke-width="0.9" fill="none" stroke-linecap="round"/>

  <!-- Smile (warm, restrained) -->
  <path d="M 22 31 Q 26 33.2 30 31" stroke="#5a3520" stroke-width="1.3" fill="none" stroke-linecap="round"/>

  <!-- Light stubble shading -->
  <path d="M 19.5 32.5 Q 26 35.5 32.5 32.5" stroke="#3a2510" stroke-width="0.4" fill="none" opacity="0.35"/>

  <!-- Ears -->
  <ellipse cx="15.5" cy="24" rx="1.6" ry="2.3" fill="#9a5b3a"/>
  <ellipse cx="36.5" cy="24" rx="1.6" ry="2.3" fill="#9a5b3a"/>
</svg>
