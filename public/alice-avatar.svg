<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
  <defs>
    <clipPath id="av">
      <circle cx="26" cy="26" r="26"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <circle cx="26" cy="26" r="26" fill="#1a1a2e"/>

  <!-- Shoulders / top of clothing -->
  <path d="M 0 52 Q 6 40 16 38 L 36 38 Q 46 40 52 52 Z" fill="#2d2d50" clip-path="url(#av)"/>

  <!-- Blouse collar accent -->
  <path d="M 20 38 L 26 46 L 32 38" stroke="#A100FF" stroke-width="1.8" fill="none" stroke-linecap="round" clip-path="url(#av)"/>

  <!-- Neck -->
  <rect x="22" y="32" width="8" height="8" rx="2" fill="#c8855a" clip-path="url(#av)"/>

  <!-- Face -->
  <ellipse cx="26" cy="23" rx="10.5" ry="12" fill="#d4906a"/>

  <!-- Hair — back volume -->
  <ellipse cx="26" cy="13" rx="12" ry="10" fill="#7B2FBE"/>

  <!-- Hair — sides flowing down -->
  <path d="M 15.5 18 Q 13 26 14 34" stroke="#7B2FBE" stroke-width="5" fill="none" stroke-linecap="round" clip-path="url(#av)"/>
  <path d="M 36.5 18 Q 39 26 38 34" stroke="#7B2FBE" stroke-width="5" fill="none" stroke-linecap="round" clip-path="url(#av)"/>

  <!-- Hair — front fringe / top -->
  <path d="M 15.5 17 Q 18 10 26 10 Q 34 10 36.5 17 Q 32 14 26 14 Q 20 14 15.5 17 Z" fill="#9B3FDE"/>

  <!-- Eyebrows -->
  <path d="M 18 19.5 Q 21 18 23.5 19.5" stroke="#7a4a30" stroke-width="1.3" fill="none" stroke-linecap="round"/>
  <path d="M 28.5 19.5 Q 31 18 34 19.5" stroke="#7a4a30" stroke-width="1.3" fill="none" stroke-linecap="round"/>

  <!-- Eyes — whites -->
  <ellipse cx="21" cy="23" rx="2.4" ry="2.2" fill="#fff"/>
  <ellipse cx="31" cy="23" rx="2.4" ry="2.2" fill="#fff"/>

  <!-- Irises -->
  <circle cx="21.4" cy="23.3" r="1.5" fill="#3a2060"/>
  <circle cx="31.4" cy="23.3" r="1.5" fill="#3a2060"/>

  <!-- Pupils -->
  <circle cx="21.6" cy="23.4" r="0.7" fill="#0d0820"/>
  <circle cx="31.6" cy="23.4" r="0.7" fill="#0d0820"/>

  <!-- Eye shine -->
  <circle cx="22" cy="22.8" r="0.4" fill="#fff" opacity="0.9"/>
  <circle cx="32" cy="22.8" r="0.4" fill="#fff" opacity="0.9"/>

  <!-- Nose -->
  <path d="M 25 25 Q 25.5 28 28 28.5" stroke="#b87050" stroke-width="1" fill="none" stroke-linecap="round"/>

  <!-- Smile -->
  <path d="M 20.5 30 Q 26 34.5 31.5 30" stroke="#a05838" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Ear -->
  <ellipse cx="15.5" cy="24" rx="1.8" ry="2.5" fill="#c8855a"/>
  <ellipse cx="36.5" cy="24" rx="1.8" ry="2.5" fill="#c8855a"/>

  <!-- Small earring -->
  <circle cx="15.5" cy="26" r="1" fill="#A100FF"/>
  <circle cx="36.5" cy="26" r="1" fill="#A100FF"/>
</svg>
